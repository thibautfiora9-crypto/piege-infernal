<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Morpion</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#14122b;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
header a{color:#fff;text-decoration:none;background:#2d2a5a;padding:8px 14px;border-radius:20px;font-weight:600;font-size:15px}
header b{font-size:18px}#sc{font-variant-numeric:tabular-nums;background:#2d2a5a;padding:8px 14px;border-radius:20px;font-weight:600}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;padding:0 10px 16px}
canvas{background:#1d1b3d;border-radius:14px;max-width:100%;touch-action:none}
button.r{background:#ffb703;color:#222;border:0;border-radius:20px;padding:10px 22px;font-weight:700;font-size:16px}
p.h{margin:0;color:#aab;font-size:14px;text-align:center}#gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(86vw,330px)}.cl{aspect-ratio:1;border-radius:14px;background:#2d2a5a;font-size:56px;font-weight:800;display:flex;align-items:center;justify-content:center}#st{font-size:20px;font-weight:700}</style></head><body>
<header><a href="index.html">← Accueil</a><b>Morpion</b><span id="sc">0</span></header>
<main><div id="st">À toi !</div><div id="gr"></div><button class="r" onclick="location.reload()">Rejouer</button><p class="h">Tu es ✕ · l'ordinateur est ○</p></main>
<script>const GK="g-morpion",best=()=>+(localStorage.getItem(GK)||0),setBest=s=>{try{if(s>best())localStorage.setItem(GK,s)}catch(e){}},sc=v=>document.getElementById('sc').textContent=v+' · record '+Math.max(v,best());sc(0);

const b=Array(9).fill(''),L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let end=0,w=0;const gr=document.getElementById('gr'),st=document.getElementById('st'),cl=[];
const win=p=>L.some(l=>l.every(i=>b[i]==p));
function ai(){const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);for(const p of['○','✕'])for(const i of e){b[i]=p;const ww=win(p);b[i]='';if(ww)return i}if(!b[4])return 4;return e[Math.random()*e.length|0]}
function ref(){b.forEach((v,i)=>cl[i].textContent=v)}
function chk(){if(win('✕')){end=1;st.textContent='Bravo, tu gagnes ! 🎉';w++;sc(1);setBest(1)}else if(win('○')){end=1;st.textContent='L\'ordi gagne…'}else if(b.every(v=>v)){end=1;st.textContent='Égalité'}}
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='cl';d.onclick=()=>{if(end||b[i])return;b[i]='✕';chk();if(!end){b[ai()]='○';chk()}ref()};cl.push(d);gr.appendChild(d)}</script></body></html>
