    if(G.combo>=5){g.textAlign='center';g.font='900 italic '+Math.round(46+pulse*8)+'px Impact,Oswald,sans-serif';g.fillStyle=fever?'#ff2bd6':'#ffffff';g.globalAlpha=.35;g.fillText(G.combo,W/2,H*.5);g.font='800 13px sans-serif';g.fillText('COMBO',W/2,H*.5+18);g.globalAlpha=1}
    if(G.judge){const a=(performance.now()-G.judge.t)/500;if(a<1){const J={p:['PARFAIT !','#ffe100'],g:['SUPER','#39ff88'],o:['OK','#00f0ff'],m:['RATÉ','#ff2b5a'],c:['COMBO '+G.combo+' !!','#ff2bd6']}[G.judge.k];g.globalAlpha=1-a;g.textAlign='center';g.font='900 italic '+Math.round(34+(1-a)*10)+'px Impact,Oswald,sans-serif';g.fillStyle=J[1];g.fillText(J[0],W/2,G2.by-Math.max(60,laneGeo(0,0).w*.6)-a*20);g.globalAlpha=1}}
    if(fever){g.strokeStyle='rgba(255,43,214,'+(.25+pulse*.4)+')';g.lineWidth=10;g.strokeRect(5,5,W-10,H-10)}}
}
requestAnimationFrame(frame);
