<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin · Piège Infernal Games</title>
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d0f1a">
<style>
:root{--bg:#0d0f1a;--card:#161a2b;--line:#ffffff14;--txt:#eef1ff;--mut:#9aa3c7;--acc:#ff8a3d;--ok:#39d98a;--bad:#ff4d6d;--blue:#4dabff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d0f1aee;backdrop-filter:blur(8px);z-index:5}
header b{font:900 20px Impact,Oswald,sans-serif;letter-spacing:1px}header b span{color:var(--acc)}header .sp{flex:1}
a.btn,button{background:#232842;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:700 14px sans-serif;cursor:pointer;text-decoration:none}
button.p{background:var(--acc);border-color:var(--acc);color:#1a0d00}button.r{background:#ff4d6d22;border-color:#ff4d6d66;color:#ffb3c1}button.g{background:#39d98a22;border-color:#39d98a66;color:#b6ffd9}
main{max-width:1180px;margin:0 auto;padding:18px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.k small{color:var(--mut);font-size:12px;letter-spacing:1px;text-transform:uppercase}.k b{display:block;font:900 34px Impact,Oswald,sans-serif;margin-top:4px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:16px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;overflow:hidden}.card h2{margin:0 0 10px;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:5px;height:170px;padding-top:10px}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--acc),#e0452b);min-height:2px}.bar small{font-size:10px;color:var(--mut)}.bar em{font-style:normal;font-size:11px;font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}.row span:last-child{color:var(--mut);white-space:nowrap}
.hb{height:6px;border-radius:3px;background:var(--blue);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;color:var(--mut);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:8px 6px;border-bottom:1px solid var(--line)}td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td button{padding:4px 10px;font-size:12px}.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:800}.tag.b{background:#ff4d6d33;color:#ffb3c1}.tag.ok{background:#39d98a22;color:#9dffcf}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button.on{background:var(--acc);color:#1a0d00;border-color:var(--acc)}
input,select{background:#0d0f1a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px}
#login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:none;flex-direction:column;gap:10px;text-align:center}
#login.on{display:flex}#app{display:none}#app.on{display:block}
.dlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}.dlg.on{display:flex}.dlg .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.mut{color:var(--mut);font-size:13px}.scroll{max-height:520px;overflow:auto}
</style></head><body>
<header><b>PIÈGE <span>INFERNAL</span> · ADMIN</b><span class="sp"></span><span class="mut" id="who"></span><button id="refresh">↻ Actualiser</button><a class="btn" href="index.html">← Site</a></header>
<div id="login"><div style="font-size:46px">🛡️</div><b style="font-size:20px">Espace réservé à BIGBOSS</b><input id="lp" placeholder="Pseudo" autocomplete="username"><input id="lpin" type="password" placeholder="Code PIN" autocomplete="current-password"><button class="p" id="lgo">Entrer</button><div class="mut" id="lmsg"></div></div>
<main id="app">
 <div class="kpi" id="kpi"></div>
 <div class="grid"><div class="card"><h2>Visiteurs par jour (14 jours)</h2><div class="bars" id="bars"></div></div><div class="card"><h2>Appareils (7 jours)</h2><div id="ua"></div></div></div>
 <div class="grid"><div class="card"><h2>Jeux et pages les plus visités (7 jours)</h2><div id="pages"></div></div><div class="card"><h2>Bannis en ce moment</h2><div id="bans" class="scroll"></div></div></div>
 <div class="card"><div class="tabs"><button class="on" data-t="recent">🕑 Dernières visites</button><button data-t="players">👤 Joueurs inscrits</button><input id="q" placeholder="Rechercher un pseudo…" style="margin-left:auto;padding:6px 10px;font-size:14px"></div><div class="scroll" id="tbl"></div></div>
</main>
<div class="dlg" id="dlg"><div class="box"><b id="dT" style="font-size:18px"></b><div class="mut" id="dS"></div><input id="dR" maxlength="140" placeholder="Raison (affichée à la personne)"><select id="dH"><option value="1">1 heure</option><option value="24" selected>24 heures</option><option value="168">7 jours</option><option value="720">30 jours</option><option value="0">Définitif</option></select><div style="display:flex;gap:8px;justify-content:flex-end"><button id="dX">Annuler</button><button class="r" id="dGo">🚫 Bannir</button></div></div></div>
<script>
'use strict';
const URL='https://sbnkndyvmhmfyijilmqd.supabase.co',KEY='sb_publishable_aXvh-KEaBdyCWFpHaWI0IQ_g2rKlVAd',$=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(fn,a){const r=await fetch(URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(a)});return r.json()}
let CR=null,D=null,tab='recent';
function acct(){try{const a=JSON.parse(localStorage.getItem('piege-cu')||'null');return a&&a.p&&a.pin?a:null}catch(e){return null}}
const ago=t=>{if(!t)return'—';const s=(Date.now()-new Date(t))/1000;return s<60?'à l’instant':s<3600?Math.floor(s/60)+' min':s<86400?Math.floor(s/3600)+' h':Math.floor(s/86400)+' j'};
const dt=t=>t?new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'—';
const until=t=>!t||new Date(t).getFullYear()>9000?'définitif':'jusqu’au '+dt(t);
async function load(){const r=await rpc('adm_stats',{p_pseudo:CR.p,p_pin:CR.pin});if(!r||!r.ok){CR=null;$('app').classList.remove('on');$('login').classList.add('on');$('lmsg').textContent='Accès refusé : seul le compte BIGBOSS peut entrer.';return}
  D=r;$('login').classList.remove('on');$('app').classList.add('on');$('who').textContent='connecté : '+CR.p;draw()}
function draw(){const r=D;
  $('kpi').innerHTML=[['Visiteurs aujourd’hui',r.uniq_today],['Pages vues aujourd’hui',r.today],['Visiteurs 7 jours',r.uniq7],['Visiteurs 30 jours',r.uniq30],['Joueurs inscrits',r.players],['Nouveaux (7 j)',r.new7]].map(([a,b])=>'<div class="k"><small>'+a+'</small><b>'+(b||0).toLocaleString('fr-FR')+'</b></div>').join('');
  // 14 derniers jours (jours sans visite compris)
  const m={};for(const d of r.days)m[d.d]=d;const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);days.push(m[d]||{d,u:0,v:0})}const mx=Math.max(1,...days.map(d=>d.u));
  $('bars').innerHTML=days.map(d=>'<div class="bar" title="'+d.v+' pages vues"><em>'+d.u+'</em><i style="height:'+Math.round(d.u/mx*100)+'%"></i><small>'+d.d.slice(8)+'/'+d.d.slice(5,7)+'</small></div>').join('');
  const um=Math.max(1,...r.ua.map(x=>x.u));$('ua').innerHTML=r.ua.map(x=>'<div class="row"><span>'+esc(x.t||'?')+'<div class="hb" style="width:'+Math.round(x.u/um*100)+'%"></div></span><span>'+x.u+'</span></div>').join('')||'<div class="mut">Pas encore de données</div>';
  const NM={index:'🏠 Accueil',gta:'🚓 Ville Folle 3D',cubia:'⛏️ Cubia',jeu:'🔥 Piège Infernal',piege:'🔥 Piège Infernal (présentation)','g-fps':'🎯 Opération Zéro','g-beat':'🎧 Beat Party','g-hockey':'🏒 Air Hockey','g-stack':'🏗️ Sky Stack','g-zone':'🧟 Zone Rouge','g-nitro':'🏎️ Nitro Rush','g-galaxy':'🚀 Galaxy Strike','g-penalty':'⚽ Penalty King','g-snake-io':'🐍 Serpent.io','g-dash':'🟦 Néon Dash','g-brick':'🧱 Brick Breaker','g-2048':'🔢 2048',admin:'🛡️ Admin'};
  const pm=Math.max(1,...r.pages.map(x=>x.u));$('pages').innerHTML=r.pages.map(x=>'<div class="row"><span>'+esc(NM[x.p]||x.p)+'<div class="hb" style="width:'+Math.round(x.u/pm*100)+'%;background:var(--acc)"></div></span><span>'+x.u+' visiteurs · '+x.v+' vues</span></div>').join('')||'<div class="mut">Pas encore de données</div>';
  $('bans').innerHTML=(r.list.filter(p=>p.b&&new Date(p.b)>new Date()).map(p=>'<div class="row"><span>👤 <b>'+esc(p.p)+'</b><br><small class="mut">'+esc(p.r||'')+' · '+until(p.b)+'</small></span><span><button class="g" data-unp="'+esc(p.p)+'">Lever</button></span></div>').join('')+
    r.bans.filter(b=>!b.who||!r.list.some(p=>p.p===b.who&&p.b)).map(b=>'<div class="row"><span>📱 appareil '+esc(b.did.slice(0,6))+(b.who?' ('+esc(b.who)+')':'')+'<br><small class="mut">'+esc(b.r||'')+' · '+until(b.u)+'</small></span><span><button class="g" data-und="'+esc(b.did)+'">Lever</button></span></div>').join(''))||'<div class="mut">Personne 😇</div>';
  drawTbl()}
function drawTbl(){const q=$('q').value.trim().toLowerCase(),r=D;let h='';
  if(tab==='recent'){h='<table><tr><th>Quand</th><th>Qui</th><th>Page</th><th>Appareil</th><th></th></tr>'+r.recent.filter(v=>!q||(v.p||'').toLowerCase().includes(q)).map(v=>'<tr><td>'+ago(v.at)+'</td><td>'+(v.p?'<b>'+esc(v.p)+'</b>':'<span class="mut">anonyme #'+esc(v.did.slice(0,6))+'</span>')+'</td><td>'+esc(v.pg)+'</td><td>'+esc(v.ua)+'</td><td>'+(v.p&&v.p.toLowerCase()==='bigboss'?'':'<button class="r" data-bd="'+esc(v.did)+'" data-who="'+esc(v.p||'')+'">Bannir</button>')+'</td></tr>').join('')+'</table>'}
  else{h='<table><tr><th>Pseudo</th><th>Inscrit</th><th>Vu</th><th>Statut</th><th></th></tr>'+r.list.filter(p=>!q||p.p.toLowerCase().includes(q)).map(p=>{const ban=p.b&&new Date(p.b)>new Date();return'<tr><td><b>'+esc(p.p)+'</b></td><td>'+dt(p.c)+'</td><td>'+ago(p.l)+'</td><td>'+(ban?'<span class="tag b">banni · '+until(p.b)+'</span>':'<span class="tag ok">actif</span>')+'</td><td>'+(p.p.toLowerCase()==='bigboss'?'':ban?'<button class="g" data-unp="'+esc(p.p)+'">Débannir</button>':'<button class="r" data-bp="'+esc(p.p)+'">Bannir</button>')+' <button class="g" data-gift="'+esc(p.p)+'">🎁 $</button></td></tr>'}).join('')+'</table>'}
  $('tbl').innerHTML=h}
let pend=null;
function ask(kind,target,label){pend={kind,target};$('dT').textContent='Bannir '+label;$('dS').textContent=kind==='player'?'Le compte ne pourra plus se connecter, et ses appareils verront l’écran « banni ».':'Cet appareil verra l’écran « banni » sur tout le site.';$('dR').value='';$('dlg').classList.add('on');$('dR').focus()}
async function act(kind,target,unban,reason,hours){const r=await rpc('adm_ban',{p_pseudo:CR.p,p_pin:CR.pin,p_kind:kind,p_target:target,p_reason:reason||'',p_hours:hours||null,p_unban:!!unban});if(!r||!r.ok)alert('Impossible : '+(r&&r.err||'erreur'));await load()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.bp)ask('player',b.dataset.bp,'le compte '+b.dataset.bp);
  else if(b.dataset.bd)ask(b.dataset.who?'player':'device',b.dataset.who||b.dataset.bd,b.dataset.who?'le compte '+b.dataset.who:'l’appareil #'+b.dataset.bd.slice(0,6));
  else if(b.dataset.gift){const n=parseInt(prompt('Combien de $ offrir à '+b.dataset.gift+' dans Ville Folle 3D ?','1000'),10);if(n>0)rpc('adm_gift',{p_pseudo:CR.p,p_pin:CR.pin,p_target:b.dataset.gift,p_amount:n,p_reason:'Cadeau de BIGBOSS'}).then(r=>alert(r&&r.ok?'🎁 Envoyé ! Il le recevra à sa prochaine connexion à Ville Folle.':'Erreur'))}
  else if(b.dataset.unp)act('player',b.dataset.unp,true);else if(b.dataset.und)act('device',b.dataset.und,true);
  else if(b.dataset.t){tab=b.dataset.t;for(const x of document.querySelectorAll('.tabs button'))x.classList.toggle('on',x===b);drawTbl()}});
$('dX').onclick=()=>$('dlg').classList.remove('on');$('dGo').onclick=async()=>{$('dlg').classList.remove('on');if(pend)await act(pend.kind,pend.target,false,$('dR').value.trim()||'Comportement interdit',+$('dH').value)};
$('q').oninput=drawTbl;$('refresh').onclick=()=>CR&&load();
$('lgo').onclick=()=>{CR={p:$('lp').value.trim(),pin:$('lpin').value};load()};$('lpin').onkeydown=e=>{if(e.key==='Enter')$('lgo').click()};
const a=acct();if(a&&a.p.toLowerCase()==='bigboss'){CR=a;load()}else $('login').classList.add('on');
setInterval(()=>{if(CR&&!document.hidden)load()},60000);
</script><script src="guard.js" defer></script></body></html>
