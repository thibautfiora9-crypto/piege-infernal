<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Casse-briques</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#14122b;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
header a{color:#fff;text-decoration:none;background:#2d2a5a;padding:8px 14px;border-radius:20px;font-weight:600;font-size:15px}
header b{font-size:18px}#sc{font-variant-numeric:tabular-nums;background:#2d2a5a;padding:8px 14px;border-radius:20px;font-weight:600}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;padding:0 10px 16px}
canvas{background:#1d1b3d;border-radius:14px;max-width:100%;touch-action:none}
button.r{background:#ffb703;color:#222;border:0;border-radius:20px;padding:10px 22px;font-weight:700;font-size:16px}
p.h{margin:0;color:#aab;font-size:14px;text-align:center}</style></head><body>
<header><a href="index.html">← Accueil</a><b>Casse-briques</b><span id="sc">0</span></header>
<main><canvas id="c" width="320" height="440"></canvas><button class="r" onclick="location.reload()">Rejouer</button><p class="h">Glisse le doigt (ou la souris / flèches) pour bouger la raquette</p></main>
<script>const GK="g-briques",best=()=>+(localStorage.getItem(GK)||0),setBest=s=>{try{if(s>best())localStorage.setItem(GK,s)}catch(e){}},sc=v=>document.getElementById('sc').textContent=v+' · record '+Math.max(v,best());sc(0);

const c=document.getElementById('c'),x=c.getContext('2d');let px=130,bx=160,by=380,vx=2.6,vy=-3.4,s=0,vie=3,dead=0,B=[];for(let r=0;r<5;r++)for(let i=0;i<8;i++)B.push({x:i*40+2,y:r*22+40,a:1,c:['#ff6b6b','#ffb703','#ffd60a','#7ed957','#4cc9f0'][r]});
function mv(cx){const r=c.getBoundingClientRect();px=Math.max(0,Math.min(240,(cx-r.left)/r.width*320-40))}
addEventListener('touchmove',e=>mv(e.touches[0].clientX),{passive:true});addEventListener('touchstart',e=>mv(e.touches[0].clientX));addEventListener('mousemove',e=>mv(e.clientX));
let K={};addEventListener('keydown',e=>K[e.key]=1);addEventListener('keyup',e=>K[e.key]=0);
function loop(){if(!dead){if(K.ArrowLeft)px=Math.max(0,px-6);if(K.ArrowRight)px=Math.min(240,px+6);bx+=vx;by+=vy;if(bx<6||bx>314)vx=-vx;if(by<6)vy=-vy;
if(by>420&&by<432&&bx>px&&bx<px+80&&vy>0){vy=-vy;vx=(bx-px-40)/12}
if(by>450){vie--;bx=160;by=380;vy=-3.4;vx=2.6;if(vie<=0){dead=1;setBest(s)}}
B.forEach(b=>{if(b.a&&bx>b.x&&bx<b.x+36&&by>b.y&&by<b.y+18){b.a=0;vy=-vy;s+=10;sc(s)}});if(!B.some(b=>b.a)){dead=2;setBest(s+vie*50)}}
x.fillStyle='#1d1b3d';x.fillRect(0,0,320,440);B.forEach(b=>{if(b.a){x.fillStyle=b.c;x.fillRect(b.x,b.y,36,18)}});x.fillStyle='#fff';x.fillRect(px,426,80,10);x.beginPath();x.arc(bx,by,6,0,7);x.fill();
x.font='14px sans-serif';x.fillText('♥ '+vie,8,430);if(dead){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,320,440);x.fillStyle='#fff';x.font='bold 28px sans-serif';x.textAlign='center';x.fillText(dead==2?'Gagné ! 🎉':'Perdu… '+s,160,220)}
requestAnimationFrame(loop)}loop()</script></body></html>
