  const land=W>H*1.05;T.rot=land;const aw=land?H:W,al=land?W:H,s=Math.min((aw-30)/1,(al-30)/RATIO);T.s=s;T.cx=W/2;T.cy=H/2}
addEventListener('resize',resize);
// passage terrain -> écran
function sc(x,y){const u=(x-.5)*T.s,v=(y-RATIO/2)*T.s;return T.rot?[T.cx+v,T.cy-u]:[T.cx+u,T.cy+v]}
function ws(px,py){const dx=px-T.cx,dy=py-T.cy;let u,v;if(T.rot){v=dx;u=-dy}else{u=dx;v=dy}return[u/T.s+.5,v/T.s+RATIO/2]}
let M=null,mode=2,lvl=1;
function newMatch(m){mode=m;M={s:[0,0],puck:null,mal:[{x:.5,y:RATIO*.85,vx:0,vy:0,tx:.5,ty:RATIO*.85},{x:.5,y:RATIO*.15,vx:0,vy:0,tx:.5,ty:RATIO*.15}],fx:[],trail:[],state:'play',serve:Math.random()<.5?0:1,goalT:0,flash:0,flashC:'#fff',shake:0,msg:'',msgT:0,hits:0};resetPuck(M.serve)}
function resetPuck(to){M.puck={x:.5,y:to===0?RATIO*.62:RATIO*.38,vx:0,vy:0};M.trail=[]}
// ---------- entrées ----------
const touches={};
cv.addEventListener('touchstart',e=>{e.preventDefault();au();for(const t of e.changedTouches){const[x,y]=ws(t.clientX,t.clientY);const side=y>RATIO/2?0:1;if(mode===1&&side===1)continue;if(Object.values(touches).includes(side))continue;touches[t.identifier]=side;setT(side,x,y)}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const s=touches[t.identifier];if(s===undefined)continue;const[x,y]=ws(t.clientX,t.clientY);setT(s,x,y)}},{passive:false});
const tend=e=>{for(const t of e.changedTouches)delete touches[t.identifier]};cv.addEventListener('touchend',tend);cv.addEventListener('touchcancel',tend);
cv.addEventListener('mousemove',e=>{if(!M)return;const[x,y]=ws(e.clientX,e.clientY);setT(0,x,y)});cv.addEventListener('mousedown',au);
function setT(i,x,y){if(!M)return;const m=M.mal[i];m.tx=x;m.ty=y}
// ---------- menus ----------
$('lvl').onclick=e=>{const b=e.target.closest('button');if(!b)return;lvl=+b.dataset.l;for(const x of $('lvl').children)x.classList.toggle('on',x===b)};
$('b2').onclick=()=>{au();$('menu').classList.remove('on');newMatch(2)};$('b1').onclick=()=>{au();$('menu').classList.remove('on');newMatch(1)};
$('again').onclick=()=>{$('over').classList.remove('on');newMatch(mode)};$('back').onclick=()=>{$('over').classList.remove('on');$('menu').classList.add('on');M=null};
// ---------- physique ----------
function clampMal(m,i){const r=MR,lo=i===0?RATIO/2+r:r,hi=i===0?RATIO-r:RATIO/2-r;m.tx=Math.max(r,Math.min(1-r,m.tx));m.ty=Math.max(lo,Math.min(hi,m.ty))}
function ai(dt){const m=M.mal[1],p=M.puck,L=[{sp:1.3,re:.35,err:.06},{sp:2.1,re:.2,err:.03},{sp:3.2,re:.08,err:.01}][lvl];
  m.think=(m.think||0)-dt;if(m.think>0)return;m.think=L.re*.25;
  if(p.y<RATIO/2+.05&&(p.vy<.3||p.y<RATIO*.3)){// attaque : se place derrière le palet et frappe vers le but adverse
    const ax=p.x+(p.x-.5)*.15+(Math.random()-.5)*L.err*4,ay=p.y-MR*.8;m.tx=ax;m.ty=ay;m.atk=1}
  else{// défense : entre le palet et son but
    const gx=.5,gy=0,k=.22;m.tx=gx+(p.x-gx)*.45+(Math.random()-.5)*L.err;m.ty=gy+RATIO*k;m.atk=0}
  m.maxSp=L.sp}
function step(dt){const p=M.puck;
  for(let i=0;i<2;i++){const m=M.mal[i];clampMal(m,i);const ox=m.x,oy=m.y;
    if(mode===1&&i===1){const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy),mx=(m.maxSp||2)*dt;if(d>mx){m.x+=dx/d*mx;m.y+=dy/d*mx}else{m.x=m.tx;m.y=m.ty}}
    else{const k=Math.min(1,dt*30);m.x+=(m.tx-m.x)*k;m.y+=(m.ty-m.y)*k}
    m.vx=(m.x-ox)/dt;m.vy=(m.y-oy)/dt;
    // collision maillet / palet
    const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy),mn=PR+MR;
    if(d<mn&&d>1e-6){const nx=dx/d,ny=dy/d;p.x=m.x+nx*mn;p.y=m.y+ny*mn;
      // palet coincé contre un bord : c'est le maillet qui recule
      const cx=Math.max(PR,Math.min(1-PR,p.x)),inG=Math.abs(p.x-.5)<GOAL/2,cy=inG?p.y:Math.max(PR,Math.min(RATIO-PR,p.y));if(cx!==p.x||cy!==p.y){p.x=cx;p.y=cy;const ex=p.x-m.x,ey=p.y-m.y,ed=Math.hypot(ex,ey)||1;m.x=p.x-ex/ed*mn;m.y=p.y-ey/ed*mn;m.tx=m.x;m.ty=m.y}
      const rv=(p.vx-m.vx)*nx+(p.vy-m.vy)*ny;
      if(rv<0){p.vx-=1.9*rv*nx;p.vy-=1.9*rv*ny;const sp=Math.hypot(p.vx,p.vy),mx=4.2;if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp}
        if(rv<-.4){M.hits++;tone(320+Math.min(600,sp*120),.07,'triangle',.18);spark(p.x-nx*PR,p.y-ny*PR,i===0?'#00f0ff':'#ff2bd6',10+Math.min(20,sp*4));M.shake=Math.min(8,sp*1.2)}}}}
  p.x+=p.vx*dt;p.y+=p.vy*dt;const fr=Math.pow(.62,dt);p.vx*=fr;p.vy*=fr;
  if(p.x<PR){p.x=PR;p.vx=Math.abs(p.vx)*.9;wall()}if(p.x>1-PR){p.x=1-PR;p.vx=-Math.abs(p.vx)*.9;wall()}
  const inGoal=Math.abs(p.x-.5)<GOAL/2;
  if(p.y<PR&&!inGoal){p.y=PR;p.vy=Math.abs(p.vy)*.9;wall()}if(p.y>RATIO-PR&&!inGoal){p.y=RATIO-PR;p.vy=-Math.abs(p.vy)*.9;wall()}
  if(p.y<-PR*2)goal(0);else if(p.y>RATIO+PR*2)goal(1);
  M.trail.push([p.x,p.y]);if(M.trail.length>14)M.trail.shift()}
function wall(){tone(200,.05,'square',.04);spark(M.puck.x,M.puck.y,'#ffffff',4)}
function spark(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=.2+Math.random()*.9;M.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,c})}}
function goal(who){M.s[who]++;M.state='goal';M.goalT=1.6;M.flash=1;M.flashC=who===0?'#00f0ff':'#ff2bd6';M.shake=16;M.msg='BUT !';M.msgT=1.6;
  tone(523,.15,'square',.12);setTimeout(()=>tone(659,.15,'square',.12),130);setTimeout(()=>tone(784,.3,'square',.12),260);
  for(let i=0;i<60;i++){const a=Math.random()*6.28,v=.3+Math.random()*1.5;M.fx.push({x:.5,y:who===0?0:RATIO,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,c:M.flashC})}
  if(M.s[who]>=7){M.state='over';setTimeout(()=>{const n=mode===1?(who===0?'TU AS GAGNÉ ! 🏆':'L’ORDI GAGNE 🤖'):(who===0?'JOUEUR BLEU GAGNE ! 🏆':'JOUEUR ROSE GAGNE ! 🏆');$('win').textContent=n;$('win').style.color=who===0?'#00f0ff':'#ff2bd6';$('ovS').textContent=M.s[0]+' – '+M.s[1];
    if(mode===1&&who===0){const k='g-hockey',b=(()=>{try{return JSON.parse(LS.get(k)||'{}')||{}}catch(e){return{}}})();b['w'+lvl]=(b['w'+lvl]||0)+1;LS.set(k,JSON.stringify(b));if(window.SITE)SITE.push().catch(()=>{})}
    $('over').classList.add('on')},1200)}
  else setTimeout(()=>{if(M&&M.state==='goal'){M.state='play';resetPuck(who===0?1:0)}},1500)}
// ---------- rendu ----------
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.03,(now-last)/1000);last=now;
  g.fillStyle='#05060f';g.fillRect(0,0,W,H);
  if(!M){drawTable(now/1000,null);return}
  if(M.state==='play'){if(mode===1)ai(dt);const n=3;for(let i=0;i<n;i++)step(dt/n)}
  else if(M.state==='goal'){for(const m of M.mal){clampMal(m,M.mal.indexOf(m));m.x+=(m.tx-m.x)*.2;m.y+=(m.ty-m.y)*.2}}
  for(let i=M.fx.length-1;i>=0;i--){const q=M.fx[i];q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;if(q.t>.7)M.fx.splice(i,1)}
  M.flash=Math.max(0,M.flash-dt*1.5);M.shake=Math.max(0,M.shake-dt*30);M.msgT=Math.max(0,M.msgT-dt);
  g.save();if(M.shake)g.translate((Math.random()-.5)*M.shake,(Math.random()-.5)*M.shake);drawTable(now/1000,M);g.restore();
  if(M.flash>0){g.fillStyle=M.flashC;g.globalAlpha=M.flash*.25;g.fillRect(0,0,W,H);g.globalAlpha=1}}
function line(a,b,c,w){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(...sc(...a));g.lineTo(...sc(...b));g.stroke()}
function circ(x,y,r,fill,stroke,w){const[px,py]=sc(x,y);g.beginPath();g.arc(px,py,r*T.s,0,7);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=w||2;g.stroke()}}
function drawTable(t,M){
  // plateau
  const c=[sc(0,0),sc(1,0),sc(1,RATIO),sc(0,RATIO)];g.fillStyle='#0a0f26';g.beginPath();g.moveTo(...c[0]);for(const q of c.slice(1))g.lineTo(...q);g.closePath();g.fill();
  // petits trous d'air
  g.fillStyle='#ffffff10';for(let i=1;i<14;i++)for(let j=1;j<23;j++){const[px,py]=sc(i/14,j/23*RATIO);g.fillRect(px-1,py-1,2,2)}
  g.save();g.beginPath();g.moveTo(...c[0]);for(const q of c.slice(1))g.lineTo(...q);g.closePath();g.clip();g.shadowBlur=14;
  line([0,RATIO/2],[1,RATIO/2],'#ffffff55',3);circ(.5,RATIO/2,.16,null,'#ffffff55',3);circ(.5,RATIO/2,.02,'#ffffff55');
  circ(.5,0,.22,null,'#ff2bd655',3);circ(.5,RATIO,.22,null,'#00f0ff55',3);g.restore();g.shadowBlur=14;
  // bords (avec ouvertures de buts)
  g.shadowColor='#ff2bd6';line([0,0],[.5-GOAL/2,0],'#ff2bd6',6);line([.5+GOAL/2,0],[1,0],'#ff2bd6',6);
  g.shadowColor='#00f0ff';line([0,RATIO],[.5-GOAL/2,RATIO],'#00f0ff',6);line([.5+GOAL/2,RATIO],[1,RATIO],'#00f0ff',6);
  g.shadowColor='#7a5cff';line([0,0],[0,RATIO],'#7a5cff',6);line([1,0],[1,RATIO],'#7a5cff',6);
  g.shadowColor='#ffe100';line([.5-GOAL/2,-.02],[.5+GOAL/2,-.02],'#ffe10088',4);line([.5-GOAL/2,RATIO+.02],[.5+GOAL/2,RATIO+.02],'#ffe10088',4);g.shadowBlur=0;
  if(!M){circ(.5+Math.sin(t)*.3,RATIO/2+Math.sin(t*1.3)*.4,PR,'#ffe100');return}
  // score en grand
  g.save();const[sx,sy]=sc(.5,RATIO/2);g.translate(sx,sy);if(T.rot)g.rotate(-Math.PI/2);g.globalAlpha=.16;g.font='900 '+Math.round(T.s*.22)+'px Impact,Oswald,sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#ff2bd6';g.fillText(M.s[1],0,-T.s*.3);g.fillStyle='#00f0ff';g.fillText(M.s[0],0,T.s*.3);g.globalAlpha=1;g.restore();
  // traînée + palet
  for(let i=0;i<M.trail.length;i++){const q=M.trail[i];circ(q[0],q[1],PR*(i/M.trail.length),'rgba(255,225,0,'+(i/M.trail.length*.35)+')')}
  if(M.state!=='goal'||M.puck.y>-.05&&M.puck.y<RATIO+.05){g.shadowBlur=20;g.shadowColor='#ffe100';circ(M.puck.x,M.puck.y,PR,'#ffe100');g.shadowBlur=0;circ(M.puck.x,M.puck.y,PR*.6,'#fff7b0')}
  // maillets
  const col=['#00f0ff','#ff2bd6'];for(let i=0;i<2;i++){const m=M.mal[i];g.shadowBlur=24;g.shadowColor=col[i];circ(m.x,m.y,MR,col[i]+'33',col[i],4);g.shadowBlur=0;circ(m.x,m.y,MR*.55,col[i]);circ(m.x,m.y,MR*.3,'#ffffffcc')}
  for(const q of M.fx){g.globalAlpha=1-q.t/.7;const[px,py]=sc(q.x,q.y);g.fillStyle=q.c;g.fillRect(px-2,py-2,4,4)}g.globalAlpha=1;
  if(M.msgT>0){g.save();g.translate(W/2,H/2);if(T.rot)g.rotate(0);g.font='900 italic '+Math.round(60+(1.6-M.msgT)*30)+'px Impact,Oswald,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle=M.flashC;g.globalAlpha=Math.min(1,M.msgT);g.shadowBlur=30;g.shadowColor=M.flashC;g.fillText(M.msg,0,0);g.restore()}
  // étiquettes des joueurs
  if(mode===2){g.font='800 13px sans-serif';g.textAlign='center';g.fillStyle='#00f0ffaa';const[a,b]=sc(.5,RATIO*.97);g.fillText('BLEU',a,b);g.fillStyle='#ff2bd6aa';const[c2,d]=sc(.5,RATIO*.04);g.save();g.translate(c2,d);g.rotate(T.rot?0:Math.PI);g.fillText('ROSE',0,0);g.restore()}}
resize();requestAnimationFrame(frame);
</script><script src="site-sync.js"></script></body></html>
