<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Serpent</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#14122b;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
header a{color:#fff;text-decoration:none;background:#2d2a5a;padding:8px 14px;border-radius:20px;font-weight:600;font-size:15px}
header b{font-size:18px}#sc{font-variant-numeric:tabular-nums;background:#2d2a5a;padding:8px 14px;border-radius:20px;font-weight:600}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;padding:0 10px 16px}
canvas{background:#1d1b3d;border-radius:14px;max-width:100%;touch-action:none}
button.r{background:#ffb703;color:#222;border:0;border-radius:20px;padding:10px 22px;font-weight:700;font-size:16px}
p.h{margin:0;color:#aab;font-size:14px;text-align:center}</style></head><body>
<header><a href="index.html">← Accueil</a><b>Serpent</b><span id="sc">0</span></header>
<main><canvas id="c" width="360" height="360"></canvas><button class="r" onclick="location.reload()">Rejouer</button><p class="h">Glisse le doigt ou flèches pour tourner</p></main>
<script>const GK="g-snake",best=()=>+(localStorage.getItem(GK)||0),setBest=s=>{try{if(s>best())localStorage.setItem(GK,s)}catch(e){}},sc=v=>document.getElementById('sc').textContent=v+' · record '+Math.max(v,best());sc(0);

const c=document.getElementById('c'),x=c.getContext('2d'),N=18,S=20;let sn=[[9,9],[8,9],[7,9]],d=[1,0],nd=[1,0],f=[13,9],s=0,dead=0;
function put(){do{f=[Math.random()*N|0,Math.random()*N|0]}while(sn.some(p=>p[0]==f[0]&&p[1]==f[1]))}
function turn(a,b){if(a!=-d[0]||b!=-d[1])if(a||b)nd=[a,b]}
addEventListener('keydown',e=>{({ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]})[e.key]&&turn(...({ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]})[e.key])});
let t0=null;addEventListener('touchstart',e=>{t0=[e.touches[0].clientX,e.touches[0].clientY]});
addEventListener('touchmove',e=>{if(!t0)return;const dx=e.touches[0].clientX-t0[0],dy=e.touches[0].clientY-t0[1];if(Math.abs(dx)+Math.abs(dy)>24){Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));t0=[e.touches[0].clientX,e.touches[0].clientY]}});
function draw(){x.fillStyle='#1d1b3d';x.fillRect(0,0,360,360);x.fillStyle='#ff4d6d';x.beginPath();x.arc(f[0]*S+10,f[1]*S+10,8,0,7);x.fill();
sn.forEach((p,i)=>{x.fillStyle=i?'#7ed957':'#b6ff8a';x.fillRect(p[0]*S+1,p[1]*S+1,S-2,S-2)});if(dead){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,360,360);x.fillStyle='#fff';x.font='bold 28px sans-serif';x.textAlign='center';x.fillText('Perdu ! Score '+s,180,180)}}
function tick(){if(dead)return;d=nd;const h=[sn[0][0]+d[0],sn[0][1]+d[1]];if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(p=>p[0]==h[0]&&p[1]==h[1])){dead=1;setBest(s);draw();return}
sn.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){s++;sc(s);put()}else sn.pop();draw()}
setInterval(tick,120);draw()</script></body></html>
